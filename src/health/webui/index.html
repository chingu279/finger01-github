<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>건강 체크인</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%AB%80%3C/text%3E%3C/svg%3E">
<style>
/* 팔레트: dataviz 기준 팔레트. 상태색은 예약색이라 계열색으로 쓰지 않는다. */
:root {
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --raised:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --line:#e6e5de;
  --series:#2a78d6; --series-soft:#2a78d61f;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-bg:#0ca30c1a; --warning-bg:#fab2192e; --serious-bg:#ec835a26; --critical-bg:#d03b3b1a;
  --radius:12px;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
         "Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --raised:#222221;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --line:#2c2c2a;
    --series:#3987e5; --series-soft:#3987e526;
    --good-bg:#0ca30c26; --warning-bg:#fab21926; --serious-bg:#ec835a26; --critical-bg:#d03b3b26;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);font-family:var(--sans);
     font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.wrap.body{padding-bottom:96px}
h1{font-size:1.35rem;margin:0;letter-spacing:-.02em}
h2{font-size:1.05rem;margin:0 0 10px;letter-spacing:-.015em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
a{color:var(--series)}

header{padding:20px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header .date{font-family:var(--mono);font-size:.85rem;color:var(--muted)}

/* 탭 */
nav{position:sticky;top:0;z-index:20;background:var(--plane);
    border-bottom:1px solid var(--line);display:flex;gap:2px;padding-top:2px}
nav button{flex:1;border:0;background:none;padding:12px 8px;cursor:pointer;
  font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:2px solid transparent}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--series)}
nav button:focus-visible{outline:2px solid var(--series);outline-offset:-4px;border-radius:4px}

section[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
      padding:16px;margin:14px 0}

/* 체크인 폼 */
.field{padding:14px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .top{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.field .name{font-weight:600}
.field .hint{font-size:.8rem;color:var(--muted)}
.field .done{margin-left:auto;font-size:.78rem;color:var(--good);font-family:var(--mono)}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{border:1px solid var(--line);background:var(--raised);border-radius:10px;
  padding:16px 0;font-size:1.1rem;font-weight:600;cursor:pointer;transition:transform .06s}
.scale button:active{transform:scale(.96)}
.scale button[aria-pressed="true"]{background:var(--series);border-color:var(--series);color:#fff}
.scale button:focus-visible{outline:2px solid var(--series);outline-offset:2px}
.scale-ends{display:flex;justify-content:space-between;font-size:.75rem;
  color:var(--muted);margin-top:6px}

input[type=text],input[type=number],textarea{
  width:100%;padding:13px 12px;font:inherit;background:var(--raised);color:var(--ink);
  border:1px solid var(--line);border-radius:10px}
input:focus,textarea:focus{outline:2px solid var(--series);outline-offset:-1px;border-color:var(--series)}
textarea{min-height:88px;resize:vertical}
.unit{font-size:.8rem;color:var(--muted);font-family:var(--mono)}

.save{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      background:linear-gradient(transparent,var(--plane) 22%)}
.save button{width:100%;max-width:728px;margin:0 auto;display:block;border:0;border-radius:12px;
  background:var(--series);color:#fff;font-weight:700;font-size:1rem;padding:16px;cursor:pointer}
.save button:disabled{opacity:.45;cursor:default}
.save button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* 준비도 히어로 */
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dial{width:104px;height:104px;flex:none}
.hero .band{font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:7px}
.hero .advice{color:var(--ink-2);font-size:.92rem;margin-top:2px}
.hero .conf{font-size:.78rem;color:var(--muted);font-family:var(--mono);margin-top:6px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:.74rem;font-weight:700;font-family:var(--mono);letter-spacing:.02em;
  color:var(--ink)}
.pill i{font-style:normal;line-height:1}
.p-good{background:var(--good-bg)} .p-good i{color:var(--good)}
.p-warning{background:var(--warning-bg)} .p-warning i{color:var(--warning)}
.p-serious{background:var(--serious-bg)} .p-serious i{color:var(--serious)}
.p-critical{background:var(--critical-bg)} .p-critical i{color:var(--critical)}
.p-muted{background:var(--grid)} .p-muted i{color:var(--muted)}

/* 안전 판정 */
.finding{border-left:3px solid var(--muted);background:var(--raised);
  border-radius:0 10px 10px 0;padding:11px 13px;margin:9px 0}
.finding.critical{border-left-color:var(--critical);background:var(--critical-bg)}
.finding.serious{border-left-color:var(--serious);background:var(--serious-bg)}
.finding.warning{border-left-color:var(--warning);background:var(--warning-bg)}
.finding .msg{font-weight:600}
.finding .act{font-size:.88rem;color:var(--ink-2);margin-top:3px}
.emergency{border:2px solid var(--critical);background:var(--critical-bg);
  border-radius:var(--radius);padding:14px;margin:12px 0}
.emergency .call{font-weight:800;font-size:1.1rem;color:var(--critical)}

.flags{list-style:none;padding:0;margin:10px 0 0}
.flags li{font-size:.88rem;color:var(--ink-2);padding:6px 0 6px 20px;position:relative}
.flags li::before{content:"⚑";position:absolute;left:0;color:var(--muted)}

/* 지표 표 */
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;
   text-transform:uppercase;color:var(--muted);font-weight:500;
   padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dev{font-size:.74rem;font-family:var(--mono);white-space:nowrap}
.dev.worse{color:var(--serious)} .dev.better{color:var(--good)}
.dev.normal,.dev.unknown,.dev.shifted{color:var(--muted)}
.dev.excluded{color:var(--muted)}

/* 차트 */
.charts{display:grid;gap:12px}
@media(min-width:640px){.charts{grid-template-columns:1fr 1fr}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 6px}
.chart .head{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.chart .title{font-weight:600;font-size:.9rem}
.chart .last{margin-left:auto;font-family:var(--mono);font-size:.9rem;font-weight:600}
.chart .sub{font-size:.72rem;color:var(--muted);font-family:var(--mono);margin-bottom:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--plane);
  padding:6px 9px;border-radius:7px;font-size:.76rem;font-family:var(--mono);
  white-space:nowrap;opacity:0;transition:opacity .1s;z-index:50}

.rangebar{display:flex;gap:6px;margin:14px 0 2px}
.rangebar button{border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:7px 13px;font-size:.84rem;cursor:pointer}
.rangebar button[aria-pressed="true"]{background:var(--ink);color:var(--plane);border-color:var(--ink)}

.note{font-size:.8rem;color:var(--muted);margin-top:14px;line-height:1.55}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.err{color:var(--critical);font-size:.88rem;margin-top:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>건강 체크인</h1>
    <span class="date mono" id="today"></span>
  </header>
</div>

<nav role="tablist">
  <button role="tab" id="tab-in" aria-selected="true" aria-controls="v-in">체크인</button>
  <button role="tab" id="tab-now" aria-selected="false" aria-controls="v-now">오늘</button>
  <button role="tab" id="tab-tr" aria-selected="false" aria-controls="v-tr">추세</button>
</nav>

<div class="wrap body">
  <section id="v-in" role="tabpanel" aria-labelledby="tab-in"><div id="form"></div></section>
  <section id="v-now" role="tabpanel" aria-labelledby="tab-now" hidden><div id="brief"></div></section>
  <section id="v-tr" role="tabpanel" aria-labelledby="tab-tr" hidden>
    <div class="rangebar" id="range"></div>
    <div id="trend"></div>
  </section>
</div>

<div class="save" id="savebar" hidden>
  <button id="save">저장하고 결과 보기</button>
</div>
<div class="tip" id="tip"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const api = async (p, o) => {
  const res = await fetch(p, o);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => v == null ? "—" :
  (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(1));

const BAND = {GOOD:"good", GREEN:"good", AMBER:"warning", CAUTION:"serious",
              RED:"critical", UNKNOWN:"muted"};
// 상태색은 절대 단독으로 의미를 나르지 않는다 — 항상 아이콘 + 라벨과 함께.
const BAND_ICON = {GREEN:"●", AMBER:"●", CAUTION:"▲", RED:"■", UNKNOWN:"○"};
const SEV = {EMERGENCY:["critical","■"], URGENT:["serious","▲"],
             ROUTINE:["warning","●"], MONITOR:["muted","○"]};

let started = Date.now();
const values = {};

/* ── 탭 ─────────────────────────────────────────────── */
const views = {"tab-in":"v-in", "tab-now":"v-now", "tab-tr":"v-tr"};
Object.keys(views).forEach(id => $("#" + id).addEventListener("click", () => show(id)));
function show(tabId) {
  Object.entries(views).forEach(([t, v]) => {
    $("#" + t).setAttribute("aria-selected", String(t === tabId));
    $("#" + v).hidden = t !== tabId;
  });
  $("#savebar").hidden = tabId !== "tab-in";
  if (tabId === "tab-now") loadBrief();
  if (tabId === "tab-tr") loadTrend();
}

/* ── 체크인 폼 ───────────────────────────────────────── */
async function loadForm() {
  const d = await api("/api/today");
  $("#today").textContent = d.date;
  const ask = d.fields.filter(f => !f.filled);
  let html = "";

  if (!d.profile_reviewed) html += `<div class="card finding warning">
    <div class="msg">프로필이 아직 검토되지 않았습니다</div>
    <div class="act">기저질환·복약·금기가 비어 있으면 안전 경계 없이 조언이 나갑니다.
    터미널에서 <span class="mono">./health init -i</span></div></div>`;

  if (d.auto.length) html += `<div class="card"><h2>이미 들어온 값</h2>
    <table><tbody>${d.auto.map(a =>
      `<tr><td>${esc(a.label)}</td><td class="num">${fmt(a.value)}</td></tr>`).join("")}
    </tbody></table>
    <div class="note">웨어러블에서 자동으로 채워진 항목입니다. 다시 묻지 않습니다.</div></div>`;

  if (!ask.length) {
    html += `<div class="card"><div class="empty">오늘 물을 항목이 모두 채워졌습니다.</div></div>`;
    $("#form").innerHTML = html;
    $("#savebar").hidden = true;
    return;
  }

  html += `<div class="card">` + ask.map(f => {
    const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : "";
    const unit = f.unit ? `<span class="unit">${esc(f.unit)}</span>` : "";
    let control;
    if (f.kind === "likert") {
      control = `<div class="scale" data-key="${esc(f.key)}" role="group"
        aria-label="${esc(f.label)}">` +
        [1,2,3,4,5].map(n => `<button type="button" aria-pressed="false" data-v="${n}">${n}</button>`).join("") +
        `</div><div class="scale-ends"><span>${esc((f.hint||"").split("·")[0]||"낮음")}</span>
         <span>${esc((f.hint||"").split("·").pop()||"높음")}</span></div>`;
    } else if (f.kind === "text") {
      control = `<textarea data-key="${esc(f.key)}"
        placeholder="증상이 있으면 본인 표현 그대로 적어주세요"></textarea>`;
    } else {
      const mode = f.kind === "time" ? "text" : "text";
      control = `<input type="${mode}" data-key="${esc(f.key)}" inputmode="decimal"
        placeholder="${esc(f.hint || "")}" autocomplete="off">`;
    }
    return `<div class="field"><div class="top"><span class="name">${esc(f.label)}</span>
      ${unit}${hint}</div>${control}</div>`;
  }).join("") + `</div>
  <div class="note">Enter 를 누를 필요가 없습니다. 값을 고르거나 적고 아래 버튼만 누르세요.
  빈 칸은 그대로 두셔도 됩니다 — 기록하지 않은 것과 0은 다르게 취급됩니다.</div>`;

  $("#form").innerHTML = html;
  $("#savebar").hidden = false;
  started = Date.now();

  $("#form").querySelectorAll(".scale").forEach(g => {
    g.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      values[g.dataset.key] = b.dataset.v;
    });
  });
  $("#form").querySelectorAll("input,textarea").forEach(el => {
    el.addEventListener("input", () => { values[el.dataset.key] = el.value.trim(); });
  });
}

$("#save").addEventListener("click", async () => {
  const btn = $("#save");
  btn.disabled = true; btn.textContent = "저장 중…";
  try {
    const res = await api("/api/checkin", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({values, seconds: Math.round((Date.now() - started) / 1000)}),
    });
    if (res.rejected && res.rejected.length) {
      btn.disabled = false; btn.textContent = "저장하고 결과 보기";
      $("#form").insertAdjacentHTML("afterbegin", `<div class="card finding serious">
        <div class="msg">저장하지 않은 값이 있습니다</div>
        <div class="act">${res.rejected.map(r =>
          esc(r.key) + ": " + esc(r.reason)).join("<br>")}</div></div>`);
      return;
    }
    renderBrief(res);
    show("tab-now");
    loadForm();
  } catch (e) {
    $("#form").insertAdjacentHTML("afterbegin",
      `<div class="err">저장 실패: ${esc(e.message)}</div>`);
  } finally {
    btn.disabled = false; btn.textContent = "저장하고 결과 보기";
  }
});

/* ── 오늘 ────────────────────────────────────────────── */
async function loadBrief() { renderBrief(await api("/api/brief")); }

function dial(score, band) {
  const r = 44, c = 2 * Math.PI * r, on = Math.max(0, Math.min(100, score)) / 100 * c;
  const color = `var(--${BAND[band] || "muted"})`;
  return `<svg class="dial" viewBox="0 0 104 104" role="img"
     aria-label="준비도 ${Math.round(score)}점, ${band}">
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--grid)" stroke-width="8"/>
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="${color}" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${on} ${c}"
      transform="rotate(-90 52 52)"/>
    <text x="52" y="58" text-anchor="middle" font-size="26" font-weight="700"
      font-family="var(--mono)" fill="var(--ink)">${Math.round(score)}</text>
  </svg>`;
}

function renderBrief(b) {
  if (b.empty) { $("#brief").innerHTML = `<div class="card"><div class="empty">
    ${esc(b.date)} 기록이 없습니다.</div></div>`; return; }
  const r = b.readiness, t = b.triage;
  let h = "";

  if (t.severity === "EMERGENCY") h += `<div class="emergency">
    <div class="call">■ 지금 즉시 119 에 연락하세요</div></div>`;

  if (t.findings.length) h += `<div class="card"><h2>안전 판정</h2>` +
    t.findings.map(f => {
      const [cls, icon] = SEV[f.severity] || ["muted","○"];
      return `<div class="finding ${cls}">
        <span class="pill p-${cls}">${icon} ${esc(f.severity)}</span>
        <div class="msg">${esc(f.message)}</div>
        <div class="act">${esc(f.action)}</div></div>`;
    }).join("") +
    (t.blocks_exercise ? `<div class="note">위 항목이 해소될 때까지 운동 처방은 제시되지 않습니다.</div>` : "") +
    `</div>`;

  const cls = BAND[r.band] || "muted";
  h += `<div class="card"><div class="hero">${dial(r.score, r.band)}
    <div style="flex:1;min-width:200px">
      <div class="band"><span class="pill p-${cls}">${BAND_ICON[r.band]||"○"} ${esc(r.band)}</span></div>
      <div class="advice">${esc(r.advice)}</div>
      <div class="conf">신뢰도 ${(r.confidence*100).toFixed(0)}%
        ${r.acwr != null ? " · ACWR " + r.acwr.toFixed(2) : ""}</div>
    </div></div>`;
  if (r.contributors.length) {
    const worst = r.contributors.filter(c => c.impact < -0.02).slice(0,3);
    const best = r.contributors.filter(c => c.impact > 0.02).slice(-3).reverse();
    h += `<div class="note">
      ${worst.length ? "끌어내린 요인: " + worst.map(c => esc(c.label)+" (z="+c.z.toFixed(1)+")").join(", ") : ""}
      ${best.length ? "<br>받쳐준 요인: " + best.map(c => esc(c.label)+" (z="+c.z.toFixed(1)+")").join(", ") : ""}
    </div>`;
  }
  if (r.flags.length) h += `<ul class="flags">` +
    r.flags.map(f => `<li>${esc(f)}</li>`).join("") + `</ul>`;
  h += `</div>`;

  const DEV = {worse:"▼ 주의", better:"▲ 좋음", normal:"· 평소", shifted:"◆ 변동",
               unknown:"— 형성 중", excluded:"⊘ 준비도에서 제외"};
  h += `<div class="card"><h2>지표 (개인 베이스라인 28일 대비)</h2>
    <table><thead><tr><th>지표</th><th style="text-align:right">오늘</th>
    <th style="text-align:right">평소</th><th>판정</th></tr></thead><tbody>` +
    b.metrics.map(m => `<tr><td>${esc(m.label)}</td>
      <td class="num">${fmt(m.value)}</td>
      <td class="num" style="color:var(--muted)">${m.mean!=null?fmt(m.mean):"—"}</td>
      <td><span class="dev ${m.deviation}">${DEV[m.deviation]||""}${
        m.z!=null && m.deviation!=="excluded" ? " z="+(m.z>0?"+":"")+m.z.toFixed(1) : ""}</span></td>
    </tr>`).join("") + `</tbody></table></div>`;

  const p = b.profile;
  h += `<div class="card"><h2>안전 경계</h2><table><tbody>
    <tr><td>기저질환</td><td>${esc(p.conditions.join(", ") || "없음")}</td></tr>
    <tr><td>복약</td><td>${esc(p.medications.join(", ") || "없음")}
      ${p.med_classes.length ? `<div class="note">인식된 계열: ${esc(p.med_classes.join(", "))}</div>`:""}
      ${p.unclassified.length ? `<div class="err">계열 미분류: ${esc(p.unclassified.join(", "))}
        — 이 약들에는 복약 기반 안전 규칙이 걸려 있지 않습니다</div>`:""}</td></tr>
    <tr><td>금기</td><td>${esc(p.contraindications.join(", ") || "없음")}</td></tr>
    ${p.clinician_note ? `<tr><td>주치의</td><td>${esc(p.clinician_note)}</td></tr>`:""}
    </tbody></table></div>
    <div class="note">이 화면은 의료 진단이 아닙니다. 자기관리를 위한 참고 정보이며,
    증상이 걱정된다면 의료 전문가의 진료를 받으세요. 응급 시 119 ·
    정신건강 위기 시 109.</div>`;

  $("#brief").innerHTML = h;
}

/* ── 추세 ────────────────────────────────────────────── */
let days = 30;
$("#range").innerHTML = [14,30,90].map(n =>
  `<button data-d="${n}" aria-pressed="${n===30}">${n}일</button>`).join("");
$("#range").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  days = +b.dataset.d;
  $("#range").querySelectorAll("button").forEach(x =>
    x.setAttribute("aria-pressed", String(x === b)));
  loadTrend();
});

async function loadTrend() {
  const d = await api("/api/trend?days=" + days);
  const series = [{path:"readiness", label:"준비도", values:d.readiness,
                   mean:null, sd:null, direction:1}, ...d.series];
  $("#trend").innerHTML = `<div class="charts">` +
    series.map((s,i) => `<div class="chart" id="c${i}"></div>`).join("") + `</div>
    <div class="note">선이 끊긴 구간은 기록이 없는 날입니다 — 0 으로 채우지 않습니다.
    옅은 띠는 28일 평균 ±1 표준편차(평소 범위)입니다.</div>`;
  series.forEach((s,i) => drawChart($("#c"+i), s, d.dates));
}

function drawChart(el, s, dates) {
  const W = 340, H = 108, PAD = {l:6, r:6, t:10, b:14};
  const vals = s.values;
  const nums = vals.filter(v => typeof v === "number");
  if (!nums.length) { el.remove(); return; }
  let lo = Math.min(...nums), hi = Math.max(...nums);
  if (s.mean != null && s.sd) { lo = Math.min(lo, s.mean - s.sd); hi = Math.max(hi, s.mean + s.sd); }
  if (hi - lo < 1e-6) { hi = lo + 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const x = i => PAD.l + i * (W - PAD.l - PAD.r) / Math.max(1, vals.length - 1);
  const y = v => PAD.t + (1 - (v - lo) / (hi - lo)) * (H - PAD.t - PAD.b);

  // 결측을 건너뛰되 선을 잇지 않는다 — 안 잰 것과 0은 다르다.
  // 다만 대부분의 점이 고립돼 있으면(혈압처럼 며칠에 한 번 재는 지표)
  // 끊어진 선은 아무것도 안 보인다. 그런 계열은 점으로 그린다.
  let pairs = 0;
  vals.forEach((v, i) => {
    if (typeof v === "number" && typeof vals[i-1] === "number") pairs++;
  });
  const asDots = pairs < nums.length * 0.5;

  let path = "", dots = "", pen = false;
  vals.forEach((v, i) => {
    if (typeof v !== "number") { pen = false; return; }
    if (asDots) {
      dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2"
        fill="var(--series)" stroke="var(--surface)" stroke-width="1.5"/>`;
    } else {
      path += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
      pen = true;
    }
  });

  let band = "";
  if (s.mean != null && s.sd) {
    const top = y(s.mean + s.sd), bot = y(s.mean - s.sd);
    band = `<rect x="${PAD.l}" y="${top.toFixed(1)}" width="${W-PAD.l-PAD.r}"
      height="${Math.max(1,(bot-top)).toFixed(1)}" fill="var(--series-soft)"/>
      <line x1="${PAD.l}" x2="${W-PAD.r}" y1="${y(s.mean).toFixed(1)}" y2="${y(s.mean).toFixed(1)}"
        stroke="var(--grid)" stroke-width="1" stroke-dasharray="3 3"/>`;
  }
  const lastI = vals.reduce((a,v,i) => typeof v === "number" ? i : a, -1);
  const lastV = lastI >= 0 ? vals[lastI] : null;
  const endDot = lastI >= 0 ? `<circle cx="${x(lastI).toFixed(1)}" cy="${y(lastV).toFixed(1)}"
      r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/>` : "";

  el.innerHTML = `<div class="head"><span class="title">${esc(s.label)}</span>
      <span class="last">${lastV != null ? fmt(lastV) : "—"}</span></div>
    <div class="sub">${s.mean != null ? "평소 " + fmt(s.mean) + (s.sd ? " ±" + fmt(s.sd) : "") : "&nbsp;"}${
      asDots ? " · 측정한 날만 표시" : ""}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
      aria-label="${esc(s.label)} ${dates[0]}부터 ${dates[dates.length-1]}까지 추이">
      ${band}
      <path d="${path}" fill="none" stroke="var(--series)" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${endDot}
      <line class="cross" x1="0" x2="0" y1="${PAD.t}" y2="${H-PAD.b}"
        stroke="var(--muted)" stroke-width="1" opacity="0"/>
    </svg>`;

  const svg = el.querySelector("svg"), cross = el.querySelector(".cross"), tip = $("#tip");
  const move = ev => {
    const box = svg.getBoundingClientRect();
    const i = Math.round((ev.clientX - box.left) / box.width * (vals.length - 1));
    if (i < 0 || i >= vals.length) return;
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i));
    cross.setAttribute("opacity", ".5");
    const v = vals[i];
    tip.textContent = dates[i] + "  " + (typeof v === "number" ? fmt(v) : "기록 없음");
    tip.style.opacity = "1";
    tip.style.left = Math.min(window.innerWidth - 140, ev.clientX + 12) + "px";
    tip.style.top = (ev.clientY - 34) + "px";
  };
  svg.addEventListener("mousemove", move);
  svg.addEventListener("mouseleave", () => {
    cross.setAttribute("opacity", "0"); tip.style.opacity = "0";
  });
}

loadForm().catch(e => $("#form").innerHTML = `<div class="err">${esc(e.message)}</div>`);
</script>
</body>
