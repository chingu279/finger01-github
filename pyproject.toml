[project]
name = "health-agent"
version = "0.1.0"
description = "개인 건강 관리 멀티에이전트 시스템 — 결정적 코어 + Claude Code 에이전트"
requires-python = ">=3.9"
dependencies = []          # 코어는 표준 라이브러리만 쓴다. 어디서나 돌아가야 한다.

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
health = "health.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
